<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iPod">
<meta name="theme-color" content="#000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>iPod</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#wrap{animation:pop .9s cubic-bezier(.2,1.25,.35,1) both}
@keyframes pop{0%{opacity:0;transform:translateY(60px) scale(.82)}60%{opacity:1}100%{opacity:1;transform:none}}
#stage{width:320px;height:540px;transform-origin:center center;position:relative}

.ipod{position:absolute;inset:0;border-radius:36px;padding:20px 20px 0;
  background:linear-gradient(160deg,#f4f5f7 0%,#d9dce1 35%,#c4c8ce 60%,#e3e5e9 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.18),0 0 0 1px #9da1a8}
.ipod.black{background:linear-gradient(160deg,#3a3b3f 0%,#1d1e21 40%,#121315 70%,#2b2c30 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.15),0 0 0 1px #2a2a2c}
/* body colours (anodised-metal gradients); the dark ones get the dark wheel via .black */
.ipod.c-red{background:linear-gradient(160deg,#e2454b 0%,#bd1f2a 38%,#9b111c 66%,#d23a42 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 1px #7d0e17}
.ipod.c-blue{background:linear-gradient(160deg,#7fb6f0 0%,#3f86d6 38%,#2b6cb9 66%,#6aa6e6 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.2),0 0 0 1px #24599a}
.ipod.c-green{background:linear-gradient(160deg,#a9df7d 0%,#6fbf45 38%,#529d31 66%,#93d368 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.2),0 0 0 1px #457f2a}
.ipod.c-pink{background:linear-gradient(160deg,#f7b8d3 0%,#ec83b1 38%,#d9629a 66%,#f3a6c8 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.18),0 0 0 1px #b8517f}
.ipod.c-gold{background:linear-gradient(160deg,#f6e7c8 0%,#e3c98f 38%,#c9a867 66%,#efdcb0 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.7),inset 0 -3px 6px rgba(0,0,0,.18),0 0 0 1px #a8884c}
.ipod.c-graphite{background:linear-gradient(160deg,#6b6f76 0%,#4b4f55 40%,#36393e 70%,#5b5f66 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.2),0 0 0 1px #2c2e32}

/* ================= Modern style (Settings ▸ Style) ================= */
.ipod.modern,.ipod.modern[class*=" c-"]{border-radius:44px;background:linear-gradient(165deg,#646c78 0%,#4b525d 45%,#3e444e 75%,#535a66 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25),inset 0 -2px 5px rgba(0,0,0,.25),0 0 0 1px #2c3038}
.modern .bezel{border-radius:20px;background:#08090b;padding:5px;box-shadow:0 0 0 1px rgba(255,255,255,.06),inset 0 0 0 1px #000}
.modern .screen{border-radius:15px;background:#0d1520}
.modern .screen::after{display:none}
.modern .hdr{background:transparent;border:0;justify-content:flex-start;padding:0 40px 0 12px;color:#9aa8bb;font-weight:600;font-size:11px;height:22px}
.modern .hdr #hclock{display:inline;color:#f2f5f9;font-weight:700;margin-right:6px}
.hdr #hclock{display:none}
.modern .hdr .pi,.modern .hdr .lk{display:none}
.modern .hdr .bat{top:6px;right:10px;border-color:#cfd6df;background:transparent;border-radius:3px}
.modern .hdr .bat::after{background:#cfd6df}
.modern .hdr .bat i{background:#f2f5f9}
.modern .list{top:22px;background:transparent}
.modern .row{color:#e9eef5;font-weight:600;margin:0 6px;border-radius:7px;padding-left:9px}
.modern .row.sel{background:rgba(255,255,255,.14);color:#fff;text-shadow:none}
.modern .row .chev,.modern .row .val{color:#7f8da1;background:transparent}
.modern .row.sel .chev,.modern .row.sel .val{color:#c9d3df}
.modern .sb{background:transparent;border:0}.modern .sb i{background:rgba(255,255,255,.35);border-radius:3px;left:1px;right:1px}
.modern .empty{color:#9aa8bb}.modern .empty b{color:#f2f5f9}
.modern .inp,.modern .clock{background:#0d1520}.modern .inp .tip{color:#9aa8bb}
.modern .clock .dig{color:#f2f5f9}.modern .clock .dt{color:#9aa8bb}
/* wheel */
.wheel .mod{display:none}
.modern .wheel .classic{display:none}
.modern .wheel .mod{display:block}
.modern .wheel{width:226px;height:226px;margin-left:-113px;top:266px;background:radial-gradient(circle at 50% 30%,#2b2f36,#1d2026 62%,#17191e);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4),0 0 0 1px #121418}
.modern .center{width:86px;height:86px;margin:-43px 0 0 -43px;background:radial-gradient(circle at 50% 35%,#24282e,#1a1d22);box-shadow:inset 0 1px 1px rgba(255,255,255,.06),0 0 0 1px #111317}
.modern .center.down{filter:brightness(1.25)}
.wheel svg.mod{position:absolute;pointer-events:none;fill:none;stroke:#e6eaf0;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.wheel svg.mod.m{top:18px;left:103px;width:20px;height:20px}
.wheel svg.mod.r{right:16px;top:102px;width:26px;height:20px}
.wheel svg.mod.l{left:16px;top:102px;width:26px;height:20px}
.wheel svg.mod.b{bottom:16px;left:101px;width:24px;height:20px}
/* modern now playing */
.mnp{position:absolute;inset:0;overflow:hidden;color:#fff;background:var(--tone,#1c2a3c)}
.mnp .bg{position:absolute;left:0;top:0;width:62%;height:100%;background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 100%);mask-image:linear-gradient(90deg,#000 45%,transparent 100%)}
.mnp .bg.fresh{animation:artIn .5s ease-out}
.mnp .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,transparent 22%,transparent 46%,var(--tone,#1c2a3c) 76%)}
.mnp .meta{position:absolute;left:46%;right:10px;top:42px}
.mnp .meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnp .t{font-size:16px;font-weight:700;letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.mnp .a{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:3px}
.mnp .al{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:2px}
.mnp .row2{position:absolute;left:12px;right:12px;top:122px;display:flex;align-items:center;gap:8px}
.mnp .fmt{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.88);display:flex;align-items:center;gap:4px}
.mnp .fmt svg{width:13px;height:10px}
.mnp .row2 .sp{flex:1}
.mnp .ic{width:18px;height:18px;fill:none;stroke:rgba(255,255,255,.88);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mnp .ic.on{fill:#fff}
.mnp .times{left:12px;right:12px;bottom:auto;top:145px;color:rgba(255,255,255,.6);font-size:10px;font-weight:600}
.mnp .bar{left:12px;right:12px;bottom:auto;top:160px;height:5px;border:0;border-radius:3px;background:rgba(255,255,255,.22)}
.mnp .bar i{background:rgba(255,255,255,.85);border-radius:3px}
.mnp .bar.scrub{overflow:visible}
.mnp .bar.scrub::after{top:-4px;width:12px;height:12px;border:0;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mnp .row3{position:absolute;left:12px;right:12px;bottom:9px;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.75);font-weight:500}
.mnp .row3 .sp{flex:1}
.mnp .row3 .ic{width:17px;height:17px}
.mnp .vol{left:12px;right:12px;bottom:9px;background:var(--tone,#1c2a3c)}
.mnp .vol svg path{fill:#fff;stroke:#fff}
.mnp .vol .vb{height:5px;border:0;border-radius:3px;background:rgba(255,255,255,.22)}
.mnp .vol .vb i{background:#fff;border-radius:3px}
.mnp.showvol .row3{visibility:hidden}
.mnp .cnt{position:absolute;left:46%;top:28px;font-size:9px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.5);text-transform:uppercase}
.modern .screen.nowmod .hdr{position:relative;z-index:3;background:linear-gradient(rgba(0,0,0,.25),transparent)}
.modern .screen.nowmod #body{position:absolute;inset:0}

/* ================= Modern ▸ Light appearance ================= */
.ipod.modern.lightui,.ipod.modern.lightui[class*=" c-"]{background:linear-gradient(165deg,#f3f4f7 0%,#dde1e7 45%,#cdd2da 75%,#e6e9ee 100%);
  box-shadow:inset 0 1px 1px #fff,inset 0 -2px 5px rgba(0,0,0,.12),0 0 0 1px #aab1bb}
.modern.lightui .bezel{background:#1a1c20}
.modern.lightui .screen{background:#f5f7fa}
.modern.lightui .hdr{color:#6b7686}.modern.lightui .hdr #hclock{color:#111827}
.modern.lightui .hdr .bat{border-color:#3a4250}.modern.lightui .hdr .bat::after{background:#3a4250}.modern.lightui .hdr .bat i{background:#3a4250}
.modern.lightui .row{color:#111827}
.modern.lightui .row.sel{background:rgba(17,24,39,.08);color:#0b1220}
.modern.lightui .row .chev,.modern.lightui .row .val{color:#8a94a3}.modern.lightui .row.sel .chev,.modern.lightui .row.sel .val{color:#4b5563}
.modern.lightui .sb i{background:rgba(17,24,39,.25)}
.modern.lightui .empty{color:#6b7686}.modern.lightui .empty b{color:#111827}
.modern.lightui .inp,.modern.lightui .clock{background:#f5f7fa}.modern.lightui .inp .tip{color:#6b7686}
.modern.lightui .clock .dig{color:#111827}.modern.lightui .clock .dt{color:#6b7686}
.modern.lightui .wheel{background:radial-gradient(circle at 50% 30%,#ffffff,#f1f3f6 62%,#e3e7ec);box-shadow:inset 0 1px 1px #fff,0 1px 2px rgba(0,0,0,.18),0 0 0 1px #c3c9d1}
.modern.lightui .center{background:radial-gradient(circle at 50% 35%,#f4f6f8,#e5e9ee);box-shadow:inset 0 1px 1px #fff,0 0 0 1px #c9cfd7}
.modern.lightui .center.down{filter:brightness(.94)}
.modern.lightui .wheel svg.mod{stroke:#3a4250}
.modern.lightui .mnp{color:#0b1220;background:var(--tint,#eef1f5)}
.modern.lightui .mnp .shade{background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,transparent 22%,transparent 46%,var(--tint,#eef1f5) 76%)}
.modern.lightui .mnp .bg{-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 100%);mask-image:linear-gradient(90deg,#000 40%,transparent 100%)}
.modern.lightui .mnp .t{text-shadow:none}
.modern.lightui .mnp .a{color:rgba(11,18,32,.75)}.modern.lightui .mnp .al,.modern.lightui .mnp .cnt{color:rgba(11,18,32,.5)}
.modern.lightui .mnp .fmt{color:rgba(11,18,32,.8)}
.modern.lightui .mnp .ic{stroke:rgba(11,18,32,.8)}.modern.lightui .mnp .ic.on{fill:#f5a524;stroke:#d48806}
.modern.lightui .mnp .ic circle[fill]{fill:rgba(11,18,32,.8)}
.modern.lightui .mnp .times{color:rgba(11,18,32,.55)}
.modern.lightui .mnp .bar{background:rgba(11,18,32,.14)}.modern.lightui .mnp .bar i{background:rgba(11,18,32,.75)}
.modern.lightui .mnp .bar.scrub::after{background:#111827}
.modern.lightui .mnp .row3{color:rgba(11,18,32,.7)}
.modern.lightui .mnp .vol{background:var(--tint,#eef1f5)}.modern.lightui .mnp .vol svg path{fill:#111827;stroke:#111827}
.modern.lightui .mnp .vol .vb{background:rgba(11,18,32,.14)}.modern.lightui .mnp .vol .vb i{background:#111827}
.modern.lightui .screen.nowmod .hdr{background:linear-gradient(rgba(255,255,255,.55),transparent)}
.modern.lightui .lyr{background:var(--tint,#f5f7fa);color:#111827}
/* Shared lyrics surface for Modern and Flow Now Playing. */
.mnp .np-lyrics{position:absolute;left:47%;right:9px;top:13px;height:106px;z-index:2;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 87%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 87%,transparent)}
.mnp .np-lyrics .lyric-lines{max-height:100%;overflow-y:auto;scrollbar-width:none;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.5;font-weight:650;color:inherit}
.mnp .np-lyrics .lyric-lines::-webkit-scrollbar{display:none}
.mnp .np-lyrics .lyric-placeholder{font-size:10px;opacity:.75}
.mnp .meta{left:12px!important;right:45%!important;top:102px!important}
.mnp .meta .t{font-size:11px!important;white-space:normal!important;line-height:1.12}
.mnp .meta .a,.mnp .meta .al{font-size:9px!important}
.mnp .row2{top:137px!important}.mnp .times{top:160px!important}.mnp .bar{top:175px!important}
.mnp .np-lyrics .lrc-line,.fnp .np-lyrics .lrc-line{opacity:.48;margin:5px 0;transition:opacity .2s}
.mnp .np-lyrics .lrc-line.active,.fnp .np-lyrics .lrc-line.active{opacity:1;font-weight:800}
.fnp.lyrics-flow .stage{left:27%;top:18px}
.fnp.lyrics-flow .np-lyrics{position:absolute;top:18px;left:54%;right:8px;height:95px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 88%,transparent)}
.fnp.lyrics-flow .np-lyrics .lyric-lines{max-height:100%;overflow-y:auto;scrollbar-width:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px;line-height:1.5;font-weight:700;text-align:left}
.fnp.lyrics-flow .np-lyrics .lyric-placeholder{opacity:.6;font-size:10px}
.fnp.lyrics-flow .cap{top:116px}
.fnp.lyrics-flow .bar{top:157px}
.fnp.lyrics-flow .times{top:165px}
.fnp.lyrics-flow .vol{top:162px}
/* ================= interactive Now Playing controls ================= */
.mnp [data-act]{cursor:pointer;border-radius:8px;transition:background .15s,box-shadow .15s}
.mnp .ic[data-act]{padding:2px;width:22px;height:22px;margin:-2px}
.mnp .ic.on{fill:#ffd166;stroke:#ffd166}
.mnp .focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.modern.lightui .mnp .focus{background:rgba(11,18,32,.08);box-shadow:0 0 0 1.5px rgba(11,18,32,.7)}
.mnp .out{display:flex;align-items:center;gap:6px;padding:2px 5px 2px 2px;margin-left:-2px}
.mnp .hint{position:absolute;left:12px;right:12px;top:144px;font-size:10px;font-weight:600;text-align:center;opacity:.8;display:none}
.mnp.ctl .hint{display:block}.mnp.ctl .times{visibility:hidden}
.mnp .toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.mnp .toast.on{opacity:1}
/* Classic Now Playing: cover at left, lyrics at right, with a soft artwork wash. */
.np.lyrics-np{background:radial-gradient(ellipse at 10% 12%,rgba(79,104,139,.32),transparent 72%),linear-gradient(135deg,#20252d,#0b0d12);color:#fff}
.np.lyrics-np .cnt{color:rgba(255,255,255,.65)}
.np.lyrics-np .top{position:absolute;left:12px;right:12px;top:22px;bottom:76px;display:flex;align-items:stretch;gap:12px;min-height:0}
.np.lyrics-np .artcol{width:40%;flex:none;align-self:center;position:relative}
.np.lyrics-np .artcol:before{content:"";position:absolute;inset:-12px;background:var(--np-art) center/cover;filter:blur(20px);opacity:.48;border-radius:30px}
.np.lyrics-np .art{position:relative;width:100%;height:auto;aspect-ratio:1;max-height:130px;background-size:cover;background-position:center;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.np.lyrics-np .refl{display:none}
.np.lyrics-np .np-lyrics{min-width:0;flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:left;mask-image:linear-gradient(transparent 0%,#000 12%,#000 83%,transparent 100%);-webkit-mask-image:linear-gradient(transparent 0%,#000 12%,#000 83%,transparent 100%)}
.np.lyrics-np .np-lyrics .lyric-lines{max-height:100%;overflow-y:auto;scrollbar-width:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.65;font-weight:650;color:rgba(255,255,255,.92)}
.np.lyrics-np .np-lyrics .lyric-lines::-webkit-scrollbar{display:none}
.np.lyrics-np .np-lyrics .lyric-placeholder{font-size:11px;line-height:1.5;color:rgba(255,255,255,.58);font-weight:500}
.np.lyrics-np .meta{position:absolute;left:14px;right:14px;bottom:44px;text-align:left}
.np.lyrics-np .meta .t{font-size:12px;font-weight:700;color:#fff}
.np.lyrics-np .meta .a,.np.lyrics-np .meta .al{font-size:10px;color:rgba(255,255,255,.68)}
.np.lyrics-np .bar{bottom:28px;background:rgba(255,255,255,.24)}
.np.lyrics-np .bar i{background:#fff}
.np.lyrics-np .times{bottom:10px;color:rgba(255,255,255,.7)}
.np.lyrics-np .vol{background:#111820;color:#fff}
@media(max-width:360px){.np.lyrics-np .top{gap:8px;left:9px;right:9px}.np.lyrics-np .np-lyrics .lyric-lines{font-size:10px}}
.np.lyrics-np .np-lyrics .lrc-line{opacity:.45;margin:6px 0;transition:opacity .2s,color .2s,transform .2s}
.np.lyrics-np .np-lyrics .lrc-line.active{opacity:1;color:#fff;transform:translateX(2px);font-weight:800}
/* lyrics */
.lyr{position:absolute;top:22px;left:0;right:0;bottom:0;overflow:hidden;background:var(--tone,#0d1520);color:#fff}
.lyr .in{padding:10px 14px 30px;font-size:14px;font-weight:700;line-height:1.45;white-space:pre-wrap;transition:transform .15s}
.lyr .none{padding:46px 18px;text-align:center;font-size:12px;opacity:.7;font-weight:500;line-height:1.5}
.lyr .none b{display:block;font-size:14px;opacity:1;margin-bottom:4px}
.screen:not(.nowmod) .lyr{top:20px}

/* ================= split-screen main menu ================= */
.split{position:absolute;top:20px;right:0;bottom:0;width:46%;overflow:hidden;display:none;background:#111;z-index:1}
.splitmode .split{display:block}
.splitmode .list{right:46%}
.splitmode .list .sb{display:none}
.split::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent)}
.split .ken{position:absolute;inset:-18%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
.split .ken.on{opacity:1;animation:ken 16s ease-in-out infinite alternate}
.split .ken.v1.on{animation-name:ken2}
@keyframes ken{from{transform:scale(1) translate(-6%,-4%)}to{transform:scale(1.18) translate(6%,5%)}}
@keyframes ken2{from{transform:scale(1.15) translate(5%,-5%)}to{transform:scale(1) translate(-5%,4%)}}
.modern .split{top:22px}
/* ================= Album Flow ================= */
.flow{position:absolute;top:20px;left:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a2f38 0%,#0b0d11 70%);perspective:420px}
.modern .flow{top:22px}
.modern.lightui .flow{background:radial-gradient(ellipse at 50% 30%,#ffffff 0%,#d9dee6 75%)}
.flow .stage{position:absolute;left:50%;top:22px;width:0;height:0;transform-style:preserve-3d}
.flow .cv{position:absolute;left:-46px;top:0;width:92px;height:92px;background-size:cover;background-position:center;border-radius:2px;
  transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s;backface-visibility:hidden;box-shadow:0 2px 8px rgba(0,0,0,.45);
  -webkit-box-reflect:below 2px linear-gradient(transparent 55%,rgba(255,255,255,.28))}
.flow.instant .cv{transition:none}
.flow.opening .cv{transition:none}
.flow.opening .cv:not(.selected){opacity:0!important}
.flow .cv{cursor:pointer}
.flow .cap{position:absolute;left:8px;right:8px;bottom:12px;text-align:center;color:#fff;line-height:1.3}
.modern.lightui .flow .cap{color:#111827}
.flow .cap b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .cap span{display:block;font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hold switch on the top edge */

.np .a,.np .al{font-size:12px;color:#333;font-weight:500;margin-bottom:2px}
.bar{position:absolute;left:10px;right:10px;bottom:22px;height:9px;border:1px solid #6c737c;border-radius:1px;background:linear-gradient(#fff,#dcdfe3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#8ec6ff,#2f7ed8 60%,#2766b8)}
.bar.scrub{overflow:visible}
.bar.scrub::after{content:"";position:absolute;top:-2px;width:9px;height:9px;left:var(--x,0);background:#fff;border:1px solid #333;transform:translateX(-50%) rotate(45deg)}
.times{position:absolute;left:10px;right:10px;bottom:6px;display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:#333}
.vol{position:absolute;left:10px;right:10px;bottom:6px;display:none;align-items:center;gap:6px}
.vol svg{width:12px;height:12px;flex:none}
.vol .vb{flex:1;height:9px;border:1px solid #6c737c;background:#fff;overflow:hidden}
.vol .vb i{display:block;height:100%;background:linear-gradient(#8ec6ff,#2f7ed8)}
.showvol .vol{display:flex}.showvol .times{visibility:hidden}
.np .vol{background:linear-gradient(#fff,#eef0f3)}

.np .art{position:relative;overflow:hidden;border-radius:8px!important;box-shadow:0 5px 14px rgba(15,27,50,.28),0 0 0 1px rgba(255,255,255,.65)!important;isolation:isolate}
.np .art::after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.34),transparent 38%,rgba(0,0,0,.24));pointer-events:none}
.np .art::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.np .top{gap:12px}
.np .t{font-size:13px;line-height:1.25}
.np .a{color:#3b567a}
.np .al{font-size:10px;color:#7a8494}
.np .cnt{color:#62758f;letter-spacing:.07em;text-transform:uppercase;font-size:9px}
.download-toast{position:absolute;z-index:8;left:8px;right:8px;bottom:7px;padding:7px 9px;border-radius:7px;background:rgba(20,33,54,.94);color:#fff;font-size:10px;line-height:1.4;box-shadow:0 3px 12px #0004;pointer-events:none}
.download-toast strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.download-toast i{display:block;height:3px;margin-top:5px;border-radius:3px;background:#80c5ff;transition:width .25s}
.download-toast .track{height:3px;background:#ffffff30;border-radius:3px;overflow:hidden;margin-top:5px}
/* video */
#ytbox{position:absolute;inset:0;display:none;background:#000;z-index:1}
#ytbox iframe,#ytbox>div{width:100%!important;height:100%!important;border:0;display:block}
.screen.video #ytbox{display:block}
.vo{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .35s;opacity:0}
.vo.on{opacity:1}
.vo .vt{position:absolute;left:0;right:0;top:0;padding:5px 8px 14px;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(rgba(0,0,0,.75),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vo .vt small{display:block;font-weight:500;opacity:.8;font-size:11px}
.vo .vbtm{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.vo .bar{border-color:#ccc}
.vo .times{color:#fff}
.vo .vol svg path{fill:#fff;stroke:#fff}
.vhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;
  padding:8px 12px;border-radius:8px;display:none;text-align:center;line-height:1.4}
.vhint.on{display:block}

/* click wheel */
.wheel{position:absolute;left:50%;top:268px;width:222px;height:222px;margin-left:-111px;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 35%,#fdfdfd,#e9eaed 60%,#d7d9dd);box-shadow:inset 0 2px 2px rgba(255,255,255,.9),inset 0 -2px 4px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.08)}
.black .wheel{background:radial-gradient(circle at 50% 35%,#2d2e32,#1c1d20 60%,#141517);box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 0 0 1px #000}
.wheel .lbl{position:absolute;font-size:13px;font-weight:700;color:#b3b7bd;letter-spacing:.5px;pointer-events:none}
.black .wheel .lbl{color:#e8e8ea}
.wheel .m{top:17px;left:0;right:0;text-align:center}
.wheel svg.ic{position:absolute;width:22px;height:14px;fill:#b3b7bd;pointer-events:none}
.black .wheel svg.ic{fill:#e8e8ea}
.wheel .r{right:15px;top:104px}.wheel .l{left:15px;top:104px}.wheel .b{bottom:17px;left:100px}
.center{position:absolute;left:50%;top:50%;width:82px;height:82px;margin:-41px 0 0 -41px;border-radius:50%;
  background:linear-gradient(#e9ebee,#cdd0d5);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 0 0 1px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.15)}
.black .center{background:linear-gradient(#36373b,#232427);box-shadow:inset 0 1px 1px rgba(255,255,255,.1),0 0 0 1px #000}
.center.down{filter:brightness(.9)}
</style>

<script>
(()=>{

const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- layout ---------- */
function fit(){const s=Math.min(innerWidth/335,innerHeight/555,1.7);$('#stage').style.transform=`scale(${s})`}

const COLORS=['Silver','Black','Graphite','Red','Blue','Green','Pink','Gold'];
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const isLightUI=()=>settings.appearance==='Light'||(settings.appearance==='Auto'&&!(darkMQ&&darkMQ.matches));

if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',()=>{applyTheme();render()});

  el.classList.toggle('black',settings.theme==='Black'||settings.theme==='Graphite');

/* Native iOS bridge; browser vibration is best-effort, not a promise of iPhone haptics. */
let lastHapticAt=0, pendingHaptic=null;

// User-tunable feel. intensity/sharpness are Core Haptics values (0–1); ms is the Android vibrate length.

  const intensity=Math.min(1,kind==='selection'?base:base+.15);

  if(pendingHaptic!==null){if((HAPTIC_RANK[kind]||0)>(HAPTIC_RANK[pendingHaptic]||0))pendingHaptic=kind;return}

    const k=pendingHaptic;pendingHaptic=null;
    const now=performance.now();
    if(k==='selection'&&now-lastHapticAt<35)return;
    lastHapticAt=now;
    const bridge=hapticBridge();
    const p=hapticParams(k);
    if(bridge){try{bridge.postMessage(p);return}catch(e){}}
    try{if(navigator.vibrate?.(k==='success'?[p.ms,45,p.ms]:p.ms))return}catch(e){}
    // iOS Safari doesn't expose reliable haptic feedback; avoid hidden switch hacks.
  });
}

/* ---------- click + haptics ---------- */
let actx=null, clickBuf=null;
function click(){
  if(settings.clicker){try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    if(!clickBuf){clickBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*.006),actx.sampleRate);
      const d=clickBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length/6));}
    const s=actx.createBufferSource(),g=actx.createGain();g.gain.value=.35;s.buffer=clickBuf;s.connect(g);g.connect(actx.destination);s.start();
  }catch(e){}}
  if(settings.haptics)triggerHaptic('selection')
}

/* ---------- local library (IndexedDB) ---------- */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('ipod',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function dbAll(){try{const d=await db();return await new Promise(r=>{const q=d.transaction('songs').objectStore('songs').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return[]}}
function dbDelete(id){return db().then(d=>new Promise((resolve,reject)=>{const tx=d.transaction('songs','readwrite');tx.objectStore('songs').delete(id);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)}))}
async function dbPut(o){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('songs','readwrite');tx.objectStore('songs').put(o);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function dbClear(){try{const d=await db();d.transaction('songs','readwrite').objectStore('songs').clear()}catch(e){}}

function decText(b,enc){
  try{let s;if(enc===0)s=new TextDecoder('latin1').decode(b);else if(enc===1){
      if(b[0]===0xFE&&b[1]===0xFF)s=new TextDecoder('utf-16be').decode(b.subarray(2));else s=new TextDecoder('utf-16le').decode(b[0]===0xFF?b.subarray(2):b)}
    else if(enc===2)s=new TextDecoder('utf-16be').decode(b);else s=new TextDecoder('utf-8').decode(b);
    return s.replace(/\0+$/,'').split('\0')[0].trim()}catch(e){return''}
}
async function readTags(file){
  const tags={};
  try{
    const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(h[0]!==73||h[1]!==68||h[2]!==51)return tags;
    const ver=h[3],size=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
    const b=new Uint8Array(await file.slice(10,10+size).arrayBuffer());
    let p=0;if(h[5]&0x40&&ver>2){p=ver===4?((b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]):((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])+4}
    const idLen=ver===2?3:4,hdLen=ver===2?6:10;
    while(p+hdLen<b.length){
      const id=String.fromCharCode(...b.subarray(p,p+idLen));if(!/^[A-Z0-9]+$/.test(id))break;
      let sz;if(ver===2)sz=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];
      else if(ver===4)sz=(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7];
      else sz=((b[p+4]<<24)>>>0)+(b[p+5]<<16)+(b[p+6]<<8)+b[p+7];
      const d=b.subarray(p+hdLen,p+hdLen+sz);p+=hdLen+sz;if(!sz)continue;
      const map={TIT2:'title',TT2:'title',TPE1:'artist',TP1:'artist',TALB:'album',TAL:'album',TRCK:'track',TRK:'track'};
      if(map[id]){tags[map[id]]=decText(d.subarray(1),d[0])}
      else if((id==='APIC'||id==='PIC')&&!tags.art){
        const enc=d[0];let i=1,mime;
        if(id==='PIC'){mime='image/'+String.fromCharCode(d[1],d[2],d[3]).toLowerCase();i=4}
        else{while(i<d.length&&d[i]!==0)i++;mime=String.fromCharCode(...d.subarray(1,i))||'image/jpeg';i++}
        i++;
        if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i]!==0)i++;i++}
        if(mime==='image/jpg')mime='image/jpeg';
        tags.art=new Blob([d.slice(i)],{type:mime});
      }
    }
  }catch(e){}
  return tags;
}
function fromName(n){n=n.replace(/\.[^.]+$/,'').replace(/^\d+[\s.\-_]+/,'');const m=n.split(' - ');return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{title:n}}
// Songs without artwork get a generated cover: a gradient + monogram picked deterministically from the album name.
const genArtCache=new Map();
function genArt(album,artist){
  const key=(album||'')+'|'+(artist||'');if(genArtCache.has(key))return genArtCache.get(key);
  let h=2166136261;for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}h>>>=0;
  const hue=h%360,hue2=(hue+40+(h>>9)%80)%360,c=document.createElement('canvas');c.width=c.height=240;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,240,240);gr.addColorStop(0,`hsl(${hue} 62% 58%)`);gr.addColorStop(1,`hsl(${hue2} 58% 32%)`);g.fillStyle=gr;g.fillRect(0,0,240,240);
  g.globalAlpha=.16;g.strokeStyle='#fff';g.lineWidth=2;for(let i=0;i<9;i++){g.beginPath();g.arc(240,240,40+i*26,0,Math.PI*2);g.stroke()}g.globalAlpha=1;
  const words=String(album&&album!=='Unknown Album'?album:artist||'♪').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/).filter(Boolean);
  const mono=(words.length>1?words[0][0]+words[1][0]:(words[0]||'♪').slice(0,2)).toUpperCase();
  g.fillStyle='rgba(255,255,255,.92)';g.font='700 84px -apple-system,Helvetica,Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=8;g.fillText(mono||'♪',120,128);
  const url=c.toDataURL('image/jpeg',.88);genArtCache.set(key,url);return url;
}
const isYoutubeThumbnail=url=>/^https?:\/\/(?:i|img)\.ytimg\.com\/vi\//i.test(String(url||''));
const artFor=s=>s?((s.artUrl&&!(settings.artworkMode==='Strict'&&isYoutubeThumbnail(s.artUrl)))?s.artUrl:genArt(s.album,s.artist)):null;
// Average colour of the artwork, darkened, used as the Modern Now Playing background.
const toneCache=new Map(),TONE0={dark:'#1c2a3c',light:'#eef1f5'};
function artTone(url,cb){
  if(!url)return cb(TONE0);if(toneCache.has(url))return cb(toneCache.get(url));
  const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=12;const g=c.getContext('2d');g.drawImage(im,0,0,12,12);
    const d=g.getImageData(0,0,12,12).data;let R=0,G=0,B=0,W=0;
    for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),w=1+(mx-mn)/40;R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}
    let [r,g2,b]=[R/W,G/W,B/W];const lum=.2126*r+.7152*g2+.0722*b,k=Math.min(1,46/Math.max(1,lum));
    const mix=(c,w)=>Math.round(c+(255-c)*w);
    const tone={dark:`rgb(${Math.round(r*k)},${Math.round(g2*k)},${Math.round(b*k)})`,light:`rgb(${mix(r,.8)},${mix(g2,.8)},${mix(b,.8)})`};
    toneCache.set(url,tone);cb(tone)}catch(e){cb(TONE0)}};
  im.onerror=()=>cb(TONE0);im.src=url;
}
const FMT={'audio/mpeg':'MP3','audio/mp3':'MP3','audio/mp4':'AAC','audio/x-m4a':'AAC','audio/aac':'AAC','audio/flac':'FLAC','audio/x-flac':'FLAC','audio/wav':'WAV','audio/x-wav':'WAV','audio/ogg':'OGG'};
const fmtOf=s=>FMT[(s&&(s.mimeType||(s.blob&&s.blob.type)))||'']||'AUDIO';
const outputName=()=>/iPhone/.test(navigator.userAgent)?'iPhone':/iPad/.test(navigator.userAgent)?'iPad':/Android/.test(navigator.userAgent)?'This Phone':'This Device';
function hydrate(r){return {...r,kind:'file',url:URL.createObjectURL(r.blob),artUrl:r.art?URL.createObjectURL(r.art):r.artworkUrl||null}}
// ----- header status bar: replaces the screen title while a task runs (like iTunes' sync display) -----
let hdrTask=null,hdrTaskTimer=null;

async function addFiles(files){

    for(let i=0;i<total;i++){
      const f=files[i];setHdrTask(`Syncing ${i+1} of ${total}`,i/total);

          title:t.title||fn.title||'Untitled',artist:t.artist||fn.artist||'Unknown Artist',album:t.album||'Unknown Album',track:parseInt(t.track)||0,art:t.art||null};
        await dbPut(rec);songs.push(hydrate(rec));n++;if(!rec.art)artFresh.add(rec.id);

function cur(){return queue[qi]}
function isPlaying(){return !audio.paused}
function curTime(){return audio.currentTime||0}
function dur(){return audio.duration||0}
function seekTo(t){if(isFinite(t))audio.currentTime=t}
function getVol(){return audio.volume}
function setVol(v){audio.volume=Math.max(0,Math.min(1,v));return audio.volume}
/* iOS/CarPlay-connected audio: one persistent media element and hardware media controls.
   This is web media playback, not a native CarPlay app entitlement. */
function resumeAudio(){return audio.play().catch(e=>{
  // iOS may block autoplay after a navigation/interrupt; user can tap Play again.
  if(e&&e.name!=='AbortError')console.warn('iPod playback needs user interaction:',e);
})}
function load(play){
  const t=cur();if(!t)return;
  if(audio.src!==t.url)audio.src=t.url;
  audio.preload='auto';
  setSession();
  if(play)resumeAudio();
  render();
}
function next(manual){if(!cur())return;
 if(!manual&&settings.repeat==='One'){seekTo(0);resumeAudio();return}
 if(importedPlayback?.queue===queue)return advanceImported(1,manual);
 if(qi<queue.length-1){qi++;load(true)}else if(settings.repeat==='All'||manual){qi=0;load(true)}
 else{audio.pause();audio.currentTime=0;render()}}
function prev(){if(!cur())return;if(curTime()>3){seekTo(0);return}if(importedPlayback?.queue===queue)return advanceImported(-1,true);if(qi>0){qi--;load(true)}else seekTo(0)}
function playPause(){if(!cur()){shuffleAll();return}audio.paused?resumeAudio():audio.pause()}
function syncMediaPlaybackState(){
  if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.playbackState=audio.paused?'paused':'playing'}catch(e){}
}
function syncMediaPosition(){
  if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState)return;
  const duration=audio.duration,position=audio.currentTime;
  if(!Number.isFinite(duration)||duration<=0||!Number.isFinite(position))return;
  try{navigator.mediaSession.setPositionState({
    duration,position:Math.max(0,Math.min(position,duration)),playbackRate:audio.playbackRate||1
  })}catch(e){}
}
audio.addEventListener('ended',()=>next(false));
['play','pause','playing','waiting'].forEach(e=>audio.addEventListener(e,()=>{
  renderHdr();syncMediaPlaybackState();
}));
['loadedmetadata','durationchange','seeked'].forEach(e=>audio.addEventListener(e,syncMediaPosition));
// MediaSession metadata and position may be cleared when iOS changes audio route or suspends Safari.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&cur()){setSession();syncMediaPlaybackState();syncMediaPosition()}
});
function safeMediaAction(name,callback){
  if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.setActionHandler(name,callback)}catch(e){}
}
function setSession(){
  if(!('mediaSession' in navigator))return;
  const t=cur();if(!t)return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.title||'Unknown Song',artist:t.artist||'Unknown Artist',album:t.album||'',
      artwork:[{src:artFor(t),sizes:'512x512'}]
    });
  }catch(e){}
  safeMediaAction('play',()=>resumeAudio());
  safeMediaAction('pause',()=>audio.pause());
  safeMediaAction('stop',()=>{audio.pause();seekTo(0)});
  safeMediaAction('nexttrack',()=>next(true));
  safeMediaAction('previoustrack',()=>prev());
  safeMediaAction('seekto',d=>{if(d&&Number.isFinite(d.seekTime)){seekTo(d.seekTime);syncMediaPosition()}});
  safeMediaAction('seekbackward',d=>{seekTo(Math.max(0,curTime()-(d.seekOffset||10)));syncMediaPosition()});
  safeMediaAction('seekforward',d=>{seekTo(Math.min(dur()||Infinity,curTime()+(d.seekOffset||10)));syncMediaPosition()});
  syncMediaPlaybackState();
  syncMediaPosition();
}

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleAll(){if(!songs.length){push(msgView('No Music','Choose “Add Music” to load songs, or open YouTube.'));return}
  latestPlayRequest++;importedPlayback=null;queue=shuffled(songs);qi=0;load(true);push(nowView())}
function playList(ss,i){
  if(ss.some(s=>s.deleted)){const keep=ss[i];ss=ss.filter(s=>!s.deleted);i=Math.max(0,ss.indexOf(keep));if(!ss.length)return}
  latestPlayRequest++;importedPlayback=null;
  if(settings.shuffle){const first=ss[i];queue=[first,...shuffled(ss.filter((_,k)=>k!==i))];qi=0}else{queue=ss.slice();qi=i}
  load(true);push(nowView())}

const decodeHTML=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
async function ytApi(path,params){
  const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
  Object.entries({...params,key:settings.ytKey}).forEach(([k,v])=>v!=null&&v!==''&&u.searchParams.set(k,v));
  const r=await fetch(u);const j=await r.json();
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return j;
}
function parseYT(str){
  str=(str||'').trim();let id=null,list=null;
  try{const u=new URL(str.startsWith('http')?str:'https://'+str);
    list=u.searchParams.get('list');id=u.searchParams.get('v');
    if(!id){const m=u.pathname.match(/^\/(?:shorts\/|embed\/|live\/)?([A-Za-z0-9_-]{11})(?:$|\/)/);if(m&&(u.hostname.includes('youtu.be')||/shorts|embed|live/.test(u.pathname)))id=m[1]}
    if(!id&&u.hostname.includes('youtu.be'))id=u.pathname.slice(1,12)||null;
  }catch(e){}
  if(!id&&!list&&/^[A-Za-z0-9_-]{11}$/.test(str))id=str;
  if(!id&&!list&&/^(PL|OL|RD|UU|LL|FL)[A-Za-z0-9_-]+$/.test(str))list=str;
  return {id,list};
}

async function doSearch(q,pageToken,prevItems,mode='flow'){
  q=String(q||'').trim();
  if(!q){replaceTop(msgView('Search Empty','Enter an artist, song, or genre.'));return}
  if(!settings.ytKey){replaceTop(msgView('Search Needs a Key','Add a YouTube API key under YouTube → YouTube Key.'));return}
  if(mode==='flow'){
    // An input view has already been replaced by a loading screen.
    const loading=top();
    try{
      const result=await ytApi('search',{part:'snippet',type:'video',maxResults:RECOMMEND_PAGE_SIZE,
        q,videoCategoryId:settings.musicOnly?'10':'',videoEmbeddable:'true'});
      const v={type:'flow',title:'Search Flow',recommendItems:[],albums:[],sel:0,
        groups:[[]],queries:[q],seen:new Set(),pageTokens:[result.nextPageToken||null],loadingMore:false};
      recommendationAddPage(v,result,0);
      if(!v.recommendItems.length)throw new Error('No results. Try another search.');
      if(top()===loading){replaceTop(v);recommendationArtPreview(v,0);recommendationMaybeLoadMore(v)}
    }catch(e){if(top()===loading)replaceTop(msgView('Search Failed',e.message||'Search unavailable.'))}
    return;

  try{
    const j=await ytApi('search',{part:'snippet',type:'video',maxResults:25,
      q,videoEmbeddable:'true',videoCategoryId:settings.musicOnly?'10':'',pageToken});

const IPOD_WORKER='https://ipod-audio-relay.kohlindersjohn.workers.dev';
const downloadJobs=new Map();
const downloadQueue=[];
let activeDownload=false,downloadNoticeTimer=null,latestPlayRequest=0;
function downloadNotice(){
 const el=$('#download-toast');if(el)el.style.display='none';
 // Share the existing sync/artwork header without interrupting those tasks.
 if(importing||artBusy)return;
 const job=[...downloadJobs.values()].find(j=>j.state!=='Done'&&j.state!=='Failed');
 if(job){
   const pct=Math.max(0,Math.min(99,Number(job.progress)||0));
   const label=job.state==='Queued'?'Audio queued':job.state==='Preparing audio…'?'Preparing audio':
     job.state==='Processing audio…'?'Processing audio':
     job.state==='Downloading audio…'?'Downloading audio':'Saving offline';
   setHdrTask(label,pct/100);
   return;
 }
 const recent=[...downloadJobs.values()].reverse().find(j=>Date.now()-j.updated<7000);
 if(recent){
   setHdrTask(recent.state==='Done'?'Audio saved':'Download failed',recent.state==='Done'?1:0,true);
 }
}
function setDownloadStatus(id,state,progress,error){
 const job=downloadJobs.get(id);if(!job)return;
 Object.assign(job,{state,progress,updated:Date.now(),error:error||''});
 downloadNotice();clearTimeout(downloadNoticeTimer);
 downloadNoticeTimer=setTimeout(downloadNotice,8000);
}
function enqueueYT(it){
 const cached=songs.find(s=>s.sourceId===it.id);if(cached)return Promise.resolve(cached);
 const prior=downloadJobs.get(it.id);
 if(prior&&prior.state!=='Failed'&&prior.state!=='Done')return prior.promise;
 const job={id:it.id,title:it.title||'YouTube audio',state:'Queued',progress:3,updated:Date.now(),promise:null};
 downloadJobs.set(it.id,job);
 job.promise=new Promise((resolve,reject)=>{downloadQueue.push({it,resolve,reject});runDownloadQueue()});
 downloadNotice();return job.promise;
}
async function runDownloadQueue(){
 if(activeDownload)return;
 activeDownload=true;
 try{
  while(downloadQueue.length){
   const task=downloadQueue.shift(),id=task.it.id;
   try{const song=await acquireYT(task.it,(state,progress)=>setDownloadStatus(id,state,progress));setDownloadStatus(id,'Done',100);task.resolve(song)}
   catch(e){setDownloadStatus(id,'Failed',0,e.message);task.reject(e)}
  }
 }finally{activeDownload=false}
}

async function acquireYT(it,onProgress=()=>{}){
 const id=it.id;if(!/^[A-Za-z0-9_-]{11}$/.test(id))throw new Error('Invalid video ID.');
 const existing=songs.find(s=>s.sourceId===id);if(existing)return existing;
 const relay=async(path,payload)=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),95000);
  let response;
  try{response=await fetch(IPOD_WORKER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal})}
  catch(e){throw new Error(e.name==='AbortError'?'Request timed out.':'Audio relay unavailable.')}
  finally{clearTimeout(timer)}
  return response;
 };
 onProgress('Preparing audio…',10);
 const created=await relay('/tornado-create',{videoId:id,authorized:true});
 const creation=await created.json().catch(()=>({}));
 if(!created.ok||!creation.jobId)throw new Error(creation.error||'Tornado job could not be created.');
 const jobId=creation.jobId;
 let info;
 for(let attempt=0;attempt<75;attempt++){
  await new Promise(resolve=>setTimeout(resolve,3000));
  const result=await relay('/tornado-status',{jobId});
  info=await result.json().catch(()=>({}));
  if(!result.ok)throw new Error(info.error||'Tornado status unavailable.');
  onProgress('Processing audio…',Math.min(65,18+attempt*2));
  if(info.status==='Completed')break;
  if(['Failed','Warning','Skipped','Cancelled','CancelledByAdmin'].includes(info.status))throw new Error(info.error||'Tornado job '+info.status);
 }
 if(info?.status!=='Completed')throw new Error('Tornado is still processing. Please try again later; do not repeatedly submit the same track.');
 onProgress('Downloading audio…',75);
 const response=await relay('/tornado-file',{jobId});
 if(!response.ok){const error=await response.json().catch(()=>({}));throw new Error(error.error||'Audio delivery failed.')}
 const type=(response.headers.get('content-type')||'').toLowerCase();
 if(!type.startsWith('audio/'))throw new Error('Audio delivery returned invalid content.');
 const blob=await response.blob();
 onProgress('Saving offline…',92);
 if(blob.size<1024)throw new Error('Audio file was empty or incomplete.');
 const parsed=cleanMusicVideoText(it.title||info.title||'Untitled');
 const rec={id:'yt-'+id,sourceId:id,blob,title:parsed||'Untitled',
  artist:it.artist||'Unknown Artist',album:it.album||'Offline Music',
  artworkUrl:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg',artSource:'youtube-thumb'};
 await dbPut(rec);const song=hydrate(rec);songs.push(song);sortSongs();
 if(settings.autoArt) Promise.resolve().then(()=>repairSongArtwork(song,{preferred:it.artSource==='matched-cover'?it.art:null})).catch(()=>{});
 return song;
}
async function playYT(items,i){
 if(!items.length||!items[i])return;
 const it=items[i],request=++latestPlayRequest;
 importedPlayback=null;
 const cached=songs.find(s=>s.sourceId===it.id);
 if(cached){playList([cached],0);return}
 // Background download: remain free to browse with the wheel.
 enqueueYT(it).then(song=>{
  if(request!==latestPlayRequest)return;
  queue=[song];qi=0;load(true);
  push(nowView());
 }).catch(e=>{
  if(request===latestPlayRequest)push(msgView('Audio Unavailable',e.message||'Could not save MP3.'));
 });
 downloadNotice();
}

// Imported playlists keep their original order and resolve audio one track ahead.
let importedPlayback=null;
function importedTrackSong(track){
 return songs.find(s=>s.id===track.song?.id||(track.video?.id&&s.sourceId===track.video.id));
}
function importedNeighbor(session,step){
 const index=session.index+step;
 if(index>=0&&index<session.tracks.length)return index;
 if(settings.repeat==='All'&&session.tracks.length>1)return step>0?0:session.tracks.length-1;
 return -1;
}
async function startImported(session,index,{open=false}={}){
 const request=++latestPlayRequest,track=session.tracks[index];
 session.pending=true;
 try{
  const song=importedTrackSong(track)||(track.video?await enqueueYT(track.video):null);
  if(request!==latestPlayRequest||importedPlayback!==session)return;
  if(!song||song.deleted)throw Error('This track is no longer available.');
  session.index=index;session.prefetched=false;
  queue=[song];session.queue=queue;qi=0;
  // Repeated copies of the same recording still start at the beginning.
  if(audio.src===song.url)seekTo(0);
  load(true);
  if(open&&top()?.type!=='now')push(nowView());
 }catch(e){
  if(request===latestPlayRequest&&importedPlayback===session){
   if(!session.queue)importedPlayback=null;
   push(msgView('Audio Unavailable',e.message||'Could not save MP3.'));
  }
 }finally{if(request===latestPlayRequest&&importedPlayback===session)session.pending=false}
}
function playImported(tracks,index){
 const selected=tracks[index],playable=tracks.filter(t=>t.song||t.video);
 const session={tracks:playable,index:playable.indexOf(selected),queue:null,pending:false,prefetched:false};
 if(session.index<0)return;
 importedPlayback=session;
 startImported(session,session.index,{open:true});
}
function advanceImported(step,manual){
 const session=importedPlayback;
 if(session.pending)return;
 const index=importedNeighbor(session,step);
 if(index>=0)startImported(session,index);
 else if(step<0)seekTo(0);
 else if(!manual){audio.pause();seekTo(0);render()}
}
function prefetchImported(){
 const session=importedPlayback,duration=dur();
 if(!session||session.queue!==queue||session.pending||session.prefetched||audio.paused||
  settings.repeat==='One'||!Number.isFinite(duration)||duration<=0||curTime()<duration/2)return;
 const next=session.tracks[importedNeighbor(session,1)];
 if(!next)return;
 session.prefetched=true;
 if(next.video&&!importedTrackSong(next))enqueueYT(next.video).catch(()=>{});
}
audio.addEventListener('timeupdate',prefetchImported);

const COVER_COLS=3,COVER_ROWS=2;
function renderCovers(v){
  const it=itemsOf(v);v.sel=Math.max(0,Math.min(v.sel,it.length-1));
  const row=Math.floor(v.sel/COVER_COLS);
  if(row<v.scroll)v.scroll=row;if(row>=v.scroll+COVER_ROWS)v.scroll=row-COVER_ROWS+1;
  let h='<div class="covergrid">';
  for(let i=v.scroll*COVER_COLS;i<Math.min(it.length,(v.scroll+COVER_ROWS)*COVER_COLS);i++){const x=it[i];
    h+=`<div class="ct${i===v.sel?' sel':''}" data-i="${i}">${x.thumb?`<span class="ci" style="background-image:url(&quot;${esc(x.thumb)}&quot;)"></span>`:`<span class="ci tx">${esc(x.tile||'')}</span>`}</div>`}
  const x=it[v.sel]||{},more=Math.ceil(it.length/COVER_COLS)>v.scroll+COVER_ROWS;
  h+=`</div><div class="covercap"><b>${esc(x.label||'')}</b><span>${esc(x.sub||'')}</span></div>${more?'<div class="covermore">▾</div>':''}`;
  body.innerHTML=h;
  body.querySelectorAll('.ct').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.i;if(i===v.sel){const y=itemsOf(v)[i];if(y&&y.action){triggerHaptic('confirm');y.action()}}else{v.sel=i;click();render()}}));
}

function tornadoUsageView(){
  const view=list('Tornado Usage',[{label:'Loading account usage…'}]);
  const gb=value=>typeof value==='number'&&Number.isFinite(value)?value.toFixed(2)+' GB':'Unavailable';
  (async()=>{
    try{
      const response=await fetch(IPOD_WORKER+'/tornado-usage',{
        method:'POST',headers:{'Content-Type':'application/json'},body:'{}'
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||'Usage request failed (HTTP '+response.status+')');
      const allowanceGB=100;
      const periodUsed=typeof data.billingPeriodUsedGB==='number'&&Number.isFinite(data.billingPeriodUsedGB)
        ?data.billingPeriodUsedGB:null;
      const officialRemaining=typeof data.remainingGB==='number'&&Number.isFinite(data.remainingGB)
        ?data.remainingGB:null;
      const calculatedRemaining=periodUsed===null?null:Math.max(0,allowanceGB-periodUsed);
      view.items=[
        {label:'Remaining (est.)',val:gb(calculatedRemaining)},
        {label:'Plan Allowance',val:gb(allowanceGB)},
        {label:'Period Used',val:gb(periodUsed)},
        {label:'Official Remaining',val:gb(officialRemaining)},
        {label:'Total API Usage',val:gb(data.effectiveUsedGB)},
        {label:'Transferred',val:gb(data.usedGB)},
        {label:'In Progress',val:gb(data.reservedGB)},
        {label:'Total Jobs',val:data.jobs==null?'Unavailable':String(data.jobs)},
        {label:periodUsed===null?'Estimate needs period usage':'Estimate = 100 GB - period used'},
        {label:'Refresh',action:()=>replaceTop(tornadoUsageView())}
      ];
    }catch(e){
      view.items=[
        {label:'Usage unavailable'},
        {label:String(e.message||'Unable to load usage')},
        {label:'Retry',action:()=>replaceTop(tornadoUsageView())}
      ];
    }
    if(top()===view)render();
  })();
  return view;
}

/* ---------- Clock ---------- */
function renderClock(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds();
  const hand=(deg,len,w,col)=>{const a=(deg-90)*Math.PI/180;return `<line x1="60" y1="60" x2="${60+len*Math.cos(a)}" y2="${60+len*Math.sin(a)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`};
  let ticks='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?50:46;ticks+=`<line x1="${60+r1*Math.sin(a)}" y1="${60-r1*Math.cos(a)}" x2="${60+53*Math.sin(a)}" y2="${60-53*Math.cos(a)}" stroke="${i%5?'#aab3c0':'#3b4757'}" stroke-width="${i%5?1:2}"/>`}
  const t12=((h+11)%12+1)+':'+String(m).padStart(2,'0');
  body.innerHTML=`<div class="clock"><svg viewBox="0 0 120 120"><defs><radialGradient id="cf" cx="45%" cy="38%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe4ea"/></radialGradient></defs>
    <circle cx="60" cy="60" r="57" fill="url(#cf)" stroke="#9aa3ad" stroke-width="2"/>${ticks}
    ${hand((h%12)*30+m/2,30,4,'#1d2a3c')}${hand(m*6+sec/10,42,3,'#1d2a3c')}${hand(sec*6,46,1.2,'#e0583a')}<circle cx="60" cy="60" r="3" fill="#e0583a"/></svg>
    <div><div class="dig">${t12}<span style="font-size:13px;margin-left:3px">${h<12?'AM':'PM'}</span></div>
    <div class="dt">${d.toLocaleDateString(undefined,{weekday:'long'})}<br>${d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div></div></div>`;
}
setInterval(()=>{if(top()&&top().type==='clock')renderClock()},1000);

/* ---------- Brick (original mini-game): wheel moves the paddle, center launches / pauses ---------- */
const BRICK_COLORS=['#ff5e5b','#ffb03b','#ffe45e','#5fd38d','#4db2ff','#a98bff'];
function brickNew(level=1,score=0,lives=3){
  const bricks=[];for(let r=0;r<Math.min(4+level,7);r++)for(let c=0;c<9;c++)bricks.push({x:9+c*28,y:24+r*11,w:24,h:8,c:BRICK_COLORS[r%6],hp:r<level-1?2:1});
  return {level,score,lives,px:110,pw:52,bx:0,by:0,vx:0,vy:0,stuck:true,paused:false,over:false,bricks,best:+(ls.get('ipod.brick.best',0))||0};
}
let brickRAF=null;
function brickMount(v){
  if(!v.g)v.g=brickNew();
  body.innerHTML='<canvas class="game" id="game" width="540" height="380"></canvas>';
  cancelAnimationFrame(brickRAF);let last=performance.now();
  const loop=t=>{if(top()!==v)return;const dt=Math.min(32,t-last)/16.67;last=t;brickStep(v.g,dt);brickDraw(v.g);brickRAF=requestAnimationFrame(loop)};
  brickRAF=requestAnimationFrame(loop);
}
function brickStep(g,dt){
  if(g.over||g.paused)return;
  if(g.stuck){g.bx=g.px+g.pw/2;g.by=170;return}
  g.bx+=g.vx*dt;g.by+=g.vy*dt;
  if(g.bx<3){g.bx=3;g.vx=Math.abs(g.vx)}if(g.bx>267){g.bx=267;g.vx=-Math.abs(g.vx)}if(g.by<3){g.by=3;g.vy=Math.abs(g.vy)}
  if(g.vy>0&&g.by>=172&&g.by<=180&&g.bx>=g.px-2&&g.bx<=g.px+g.pw+2){   // paddle: angle depends on where it hits
    const off=(g.bx-(g.px+g.pw/2))/(g.pw/2),sp=Math.hypot(g.vx,g.vy);
    g.vx=sp*Math.sin(off*1.05);g.vy=-Math.abs(sp*Math.cos(off*1.05));g.by=171;if(settings.haptics)triggerHaptic('selection');
  }
  for(const b of g.bricks){if(b.hp<=0)continue;
    if(g.bx>b.x-2&&g.bx<b.x+b.w+2&&g.by>b.y-2&&g.by<b.y+b.h+2){
      b.hp--;g.score+=10*g.level;
      const fromSide=Math.min(Math.abs(g.bx-b.x),Math.abs(g.bx-b.x-b.w))<Math.min(Math.abs(g.by-b.y),Math.abs(g.by-b.y-b.h));
      if(fromSide)g.vx=-g.vx;else g.vy=-g.vy;
      if(settings.haptics)triggerHaptic(b.hp<=0?'confirm':'selection');break}}
  if(g.bricks.every(b=>b.hp<=0)){const n=brickNew(g.level+1,g.score,g.lives);Object.assign(g,n);if(settings.haptics)triggerHaptic('success');return}
  if(g.by>192){g.lives--;g.stuck=true;if(g.lives<=0){g.over=true;if(g.score>g.best){g.best=g.score;ls.set('ipod.brick.best',g.best)}}}
}
function brickDraw(g){
  const cv=$('#game');if(!cv)return;const x=cv.getContext('2d');x.setTransform(2,0,0,2,0,0);
  const bg=x.createLinearGradient(0,0,0,190);bg.addColorStop(0,'#16213a');bg.addColorStop(1,'#0b0f19');x.fillStyle=bg;x.fillRect(0,0,270,190);
  x.font='700 10px -apple-system,Helvetica,Arial';x.fillStyle='#9fb3d1';x.textBaseline='top';
  x.fillText('SCORE '+g.score,7,6);x.textAlign='center';x.fillText('LV '+g.level,135,6);x.textAlign='right';x.fillText('♥'.repeat(Math.max(0,g.lives)),263,6);x.textAlign='left';
  for(const b of g.bricks){if(b.hp<=0)continue;const gr=x.createLinearGradient(0,b.y,0,b.y+b.h);gr.addColorStop(0,'#fff8');gr.addColorStop(.35,b.c);gr.addColorStop(1,b.c);
    x.fillStyle=gr;x.globalAlpha=b.hp>1?1:.92;x.beginPath();x.roundRect?x.roundRect(b.x,b.y,b.w,b.h,2):x.rect(b.x,b.y,b.w,b.h);x.fill();x.globalAlpha=1;
    if(b.hp>1){x.strokeStyle='#fff';x.lineWidth=1;x.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1)}}
  const pg=x.createLinearGradient(0,176,0,182);pg.addColorStop(0,'#e9f2ff');pg.addColorStop(1,'#6aa6e6');x.fillStyle=pg;x.beginPath();x.roundRect?x.roundRect(g.px,176,g.pw,6,3):x.rect(g.px,176,g.pw,6);x.fill();
  x.fillStyle='#fff';x.shadowColor='#8cf';x.shadowBlur=6;x.beginPath();x.arc(g.bx,g.by,3,0,Math.PI*2);x.fill();x.shadowBlur=0;
  const banner=(a,b)=>{x.fillStyle='rgba(8,12,20,.72)';x.fillRect(35,80,200,44);x.fillStyle='#fff';x.textAlign='center';x.font='700 14px -apple-system,Helvetica,Arial';x.fillText(a,135,88);
    x.font='600 10px -apple-system,Helvetica,Arial';x.fillStyle='#9fb3d1';x.fillText(b,135,108);x.textAlign='left'};
  if(g.over)banner('Game Over',`Score ${g.score} · Best ${g.best} · Center to retry`);
  else if(g.paused)banner('Paused','Center to resume · MENU to quit');
  else if(g.stuck)banner(g.level>1&&g.lives===3&&g.score?'Level '+g.level:'Brick','Spin to move · Center to launch');
}
function brickInput(v,btn,dir){
  const g=v.g;if(!g)return;
  if(dir){if(!g.paused&&!g.over){const nx=Math.max(0,Math.min(270-g.pw,g.px+dir*16));if(nx!==g.px){g.px=nx;click()}}return}   // tick + haptic per paddle step
  if(btn==='select'){if(g.over){v.g=brickNew();return}if(g.stuck){g.stuck=false;const a=(Math.random()*.6-.3);g.vx=2.6*Math.sin(a);g.vy=-2.6*Math.cos(a)-(g.level-1)*.25;return}g.paused=!g.paused}
  if(btn==='play')g.paused=!g.paused;
}

  for(let i=lo;i<=hi;i++)cards+=`<div class="cv" data-q="${i}" style="background-image:url(&quot;${esc(artFor(queue[i]))}&quot;)"></div>`;
  body.innerHTML=`<div class="fnp instant lyrics-flow" id="np"><span class="tag l">${qi>0?'Previous':''}</span><span class="tag r">${qi<queue.length-1?'Up Next':''}</span>
    <div class="stage">${cards}</div>

    <div class="bar${scrub?' scrub':''}" id="bar"><i id="prog"></i></div>
    <div class="times"><span id="el">0:00</span><span id="rem">-0:00</span></div>
    <div class="vol"><svg viewBox="0 0 12 12"><path d="M1 4h2.5L7 1v10L3.5 8H1z"/></svg><div class="vb"><i id="vbi"></i></div>
      <svg viewBox="0 0 12 12"><path d="M1 4h2.5L7 1v10L3.5 8H1z"/><path d="M8.5 3.5a3.5 3.5 0 010 5M10 2a5.5 5.5 0 010 8" fill="none"/></svg></div></div>`;
  const els=[...document.querySelectorAll('#np .cv')];
  els.forEach(el=>nowFlowPos(el,+el.dataset.q-from));           // start where the shelf was …
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('#np');if(!f)return;f.classList.remove('instant');
    els.forEach(el=>nowFlowPos(el,+el.dataset.q-qi))}));        // … and glide to the new song

function jsonp(url,ms=9000,param='output=jsonp&callback='){

  const eligible=songs.filter(s=>s.blob&&!artworkProtected(s)
    &&(mode==='all'||artworkNeedsRepair(s))&&(!quiet||!artTried.has(s.id)))
    .sort((a,b)=>Number(artFresh.has(b.id))-Number(artFresh.has(a.id)));

async function lyricaRequest(s){
  if(!settings.lyricaUrl)return null;
  const qs=new URLSearchParams({artist:s.artist,song:s.title,timestamps:'true',word:'true'});
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),70000);
  try{
    const resp=await fetch(settings.lyricaUrl+'/lyrics/?'+qs.toString(),{signal:controller.signal,headers:{Accept:'application/json'}});
    if(!resp.ok)return null;
    const payload=await resp.json(),d=payload?.data;
    if(payload?.status!=='success'||!d)return null;
    const norm=x=>lyricNorm(x).replace(/\b(feat|ft)\b.*$/,'').trim();
    if(d.artist&&norm(d.artist)!==norm(s.artist))return null;
    if(d.title&&norm(d.title)!==norm(s.title))return null;
    const raw=Array.isArray(d.timed_lyrics)?d.timed_lyrics:[];
    const lines=raw.map(line=>({
      at:Number(line.start_time)/1000,
      text:String(line.text||'').trim(),
      words:Array.isArray(line.words)?line.words.map(w=>({text:String(w.word||''),at:Number(w.start)/1000,end:Number(w.end)/1000})).filter(w=>w.text&&Number.isFinite(w.at)):[],
    })).filter(line=>line.text&&Number.isFinite(line.at)).sort((a,b)=>a.at-b.at);
    const plain=String(d.lyrics||'').trim();
    const text=plain||lines.map(line=>line.text).join('\n');
    return text?{text,lines,source:'Lyrica ('+String(d.source||'unknown')+')'}:null;
  }catch(e){return null}

  })().finally(()=>{s._lyricsLoading=null});
  return s._lyricsLoading;
}
function nowLyricsHTML(s){
  return s.lyrics?esc(s.lyrics):s.onlineLyrics?lyricMarkup(s.onlineLyrics):'<span class="lyric-placeholder">Finding lyrics…</span>';
}
function ensureNowLyrics(s){
  if(!s)return;
  if(!s.lyrics&&!s.onlineLyrics)populateLyrics(s).then(data=>fillNowLyrics(s,data)).catch(()=>fillNowLyrics(s,null));
  else if(s.onlineLyrics?.lines?.length)syncLyricLine();
}
function fillNowLyrics(s,data){
  const node=$('#np-lyric-lines');if(!node||cur()?.id!==s.id||top().type!=='now')return;
  node.innerHTML=data?lyricMarkup(data):'<span class="lyric-placeholder">Lyrics unavailable for this track.</span>';
  if(data?.lines?.length){node.dataset.active='';syncLyricLine()}
}
async function openLyrics(s){
  const v={type:'lyrics',title:'Lyrics',song:s,text:s.lyrics||s.onlineLyrics?.text||null,off:0};push(v);
  if(!v.text){const data=await populateLyrics(s);v.text=data?.text||'';if(top()===v)render()}
}
function renderLyrics(v){
  const s=v.song;
  body.innerHTML=v.text?`<div class="lyr" id="lyr"><div class="in" style="transform:translateY(${-v.off}px)">${esc(v.text)}</div></div>`
    :`<div class="lyr" id="lyr"><div class="none"><b>${v.text==null?'Loading…':'No Lyrics'}</b>${v.text==null?'':'This song file doesn’t include lyrics. Lyrics saved in a file’s tags (for example by a music tagger) show up here.'}</div></div>`;
  const art=artFor(s),el=$('#lyr');artTone(art,t=>{if(el&&el.isConnected){el.style.setProperty('--tone',t.dark);el.style.setProperty('--tint',t.light)}});

/* ---------- input actions ---------- */
function submitInput(){const v=top();if(v.type!=='input')return;const val=($('#inpt')||{}).value||v.value||'';
  try{$('#inpt').blur()}catch(e){}
  if(!val.trim()&&v.title!=='YouTube Key')return;v.onSubmit(val)}
// ----- Hold switch -----
let holdOn=false,lockTimer=null;
let displayLock=null,requestingDisplayLock=false;
async function syncHoldDisplayLock(){
  if(!holdOn||document.visibilityState!=='visible'){
    const lock=displayLock;displayLock=null;
    if(lock&&!lock.released)await lock.release().catch(()=>{});
    return;
  }
  if((displayLock&&!displayLock.released)||requestingDisplayLock||!navigator.wakeLock)return;
  requestingDisplayLock=true;
  try{
    const lock=await navigator.wakeLock.request('screen');
    if(holdOn&&document.visibilityState==='visible')displayLock=lock;
    else await lock.release();
  }catch{}finally{requestingDisplayLock=false}
}
function setHold(on){
  holdOn=on;
  $('#hold').classList.toggle('on',on);
  $('#lk').classList.toggle('on',on);
  if(on)showLock();else $('#lockpop').classList.remove('on');
  wake();
  syncHoldDisplayLock();
}
function showLock(){$('#lockpop').classList.add('on');clearTimeout(lockTimer);lockTimer=setTimeout(()=>$('#lockpop').classList.remove('on'),1100)}
$('#hold').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();setHold(!holdOn);click()});
document.addEventListener('visibilitychange',syncHoldDisplayLock);
// ----- Backlight -----
let lightTimer=null;
function wake(){
  screenEl.classList.remove('dim');
  clearTimeout(lightTimer);
  if(holdOn)return;
  const ms={'10 sec':1e4,'20 sec':2e4,'1 min':6e4}[settings.backlight];
  if(ms&&!(top()&&top().type==='brick'))lightTimer=setTimeout(()=>screenEl.classList.add('dim'),ms);
}
// ----- Fast scroll (acceleration) + jump letter -----
let lastTickAt=0,streak=0,letterTimer=null;
function accelStep(){
  const now=performance.now(),fast=now-lastTickAt<70;lastTickAt=now;streak=fast?streak+1:0;
  const v=top();if(!settings.accel||!v||v.type!=='list')return 1;
  const n=itemsOf(v).length;if(n<40)return 1;
  return streak>18?6:streak>8?3:1;
}
function showLetter(v){const x=itemsOf(v)[v.sel];if(!x)return;const ch=(String(x.label).trim()[0]||'').toUpperCase();if(!ch)return;
  const el=$('#letter');el.textContent=/[A-Z]/.test(ch)?ch:'#';el.classList.add('on');clearTimeout(letterTimer);letterTimer=setTimeout(()=>el.classList.remove('on'),550)}
function scroll(dir){
  wake();
  if(holdOn){showLock();return}
  if(sheet){sheetScroll(dir);return}
  const v=top();
  if(v.type==='brick'){brickInput(v,null,dir);return}
  if(v.type==='music-home'){const ns=Math.max(0,Math.min(3,v.sel+dir));if(ns!==v.sel){v.sel=ns;click();renderMusicHome(v)}return}
  if(v.type==='list'&&isFlowMenu(v)){const n=itemsOf(v).length,ns=Math.max(0,Math.min(n-1,v.sel+dir));if(ns!==v.sel){v.sel=ns;click();flowMenuUpdate(v)}return}
  if(v.type==='list'){const k=accelStep();if(k>1){const n=itemsOf(v).length;const ns=Math.max(0,Math.min(n-1,v.sel+dir*k));if(ns!==v.sel){v.sel=ns;click();render();showLetter(v)}return}}
  if(v.type==='covers'){const n=itemsOf(v).length,ns=Math.max(0,Math.min(n-1,v.sel+dir));if(ns!==v.sel){v.sel=ns;click();render()}return}
  if(v.type==='list'){const n=itemsOf(v).length;const ns=Math.max(0,Math.min(n-1,v.sel+dir));if(ns!==v.sel){v.sel=ns;click();render()}}
  else if(v.type==='flow'&&!v.opening){const n=v.albums.length,ns=Math.max(0,Math.min(n-1,v.sel+dir));if(ns!==v.sel){const was=v.sel;v.sel=ns;click();
    if(v._lo!=null&&((v.sel<v._lo+6&&v._lo>0)||(v.sel>v._hi-6&&v._hi<n-1)))renderFlow(v,was);else flowUpdate(v);if(v.recommendItems){recommendationArtPreview(v,v.sel);recommendationMaybeLoadMore(v)}}}
  else if(v.type==='lyrics'){const el=$('#lyr .in');if(!el)return;const max=Math.max(0,el.scrollHeight-150);const no=Math.max(0,Math.min(max,v.off+dir*22));if(no!==v.off){v.off=no;click();el.style.transform=`translateY(${-no}px)`}}
  else if(v.type==='now'&&ctl!=null){click();ctl=(ctl+dir+ACTS.length)%ACTS.length;applyCtlFocus()}
  else if(v.type==='now'||v.type==='video'){
    click();
    if(scrub){const d=dur();if(d){seekTo(Math.max(0,Math.min(d-.5,curTime()+dir*Math.max(2,d/100))));tick();if(v.type==='video')flashVo()}}
    else{setVol(+(getVol()+dir*.0625).toFixed(4));showVol()}
  }
}
function press(btn){
  wake();
  if(holdOn){showLock();return}
  if(sheet){sheetPress(btn);return}
  if(top().type==='brick'&&btn!=='menu'){click();brickInput(top(),btn,0);return}
  click();
  if(btn==='select')triggerHaptic('confirm');
  const v=top();
  if(btn==='menu'){if(v.type==='input')try{$('#inpt').blur()}catch(e){}if(v.type==='now'&&ctl!=null){ctl=null;applyCtlFocus()}else if(scrub){scrub=false;render()}else pop()}
  else if(btn==='next')next(true);
  else if(btn==='prev')prev();
  else if(btn==='play'&&v.type==='flow'){if(v.recommendItems)playYT(v.recommendItems,v.sel);else if(v.songList)playList(v.songList,v.sel);else if(v.playlistCards)selectFlow(v);else if(v.albums[v.sel])playList(v.albums[v.sel].songs,0)}
  else if(btn==='play'){playPause();if(v.type==='video')flashVo()}
  else if(btn==='select'){
    if(v.type==='music-home'){const x=v.choices[v.sel];if(x&&x.action)x.action()}
    if(v.type==='list'||v.type==='covers'){const x=itemsOf(v)[v.sel];if(x&&x.action)x.action()}
    else if(v.type==='msg')pop();
    else if(v.type==='flow')selectFlow(v);
    else if(v.type==='input')submitInput();
    else if(v.type==='now'&&cur()){
      // Double-tap (two presses within 300 ms) opens the song menu; a single press keeps its normal job.
      if(npTapTimer){clearTimeout(npTapTimer);npTapTimer=null;scrub=false;ctl=null;push(songOptions(cur()));return}
      npTapTimer=setTimeout(()=>{npTapTimer=null;if(top()!==v)return;
        if(settings.style==='Modern'&&settings.npStyle!=='Flow'){   // Modern: normal → scrub → controls (center then opens)
          if(ctl!=null)npAction(ACTS[ctl]);else if(scrub){scrub=false;ctl=0;render()}else{scrub=true;render()}}
        else{scrub=!scrub;render()}},300);
    }
    else if(v.type==='now'||v.type==='video'){scrub=!scrub;render()}
  }
}

body.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-act]');if(!a||holdOn)return;wake();click();npAction(a.dataset.act)});

/* ---------- click wheel ---------- */
const STEP=15;
let tr=null;
function ang(e){const r=wheel.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
wheel.addEventListener('pointerdown',e=>{if(e.target===center)return;e.preventDefault();wheel.setPointerCapture(e.pointerId);const a=ang(e);tr={id:e.pointerId,start:a,last:a,acc:0,moved:0}});
wheel.addEventListener('pointermove',e=>{
  if(!tr||e.pointerId!==tr.id)return;const a=ang(e);let d=a-tr.last;if(d>180)d-=360;if(d<-180)d+=360;
  tr.last=a;tr.acc+=d;tr.moved+=Math.abs(d);
  while(tr.acc>=STEP){tr.acc-=STEP;scroll(1)}while(tr.acc<=-STEP){tr.acc+=STEP;scroll(-1)}
});
function endTrack(e){
  if(!tr||e.pointerId!==tr.id)return;
  if(tr.moved<8&&e.type==='pointerup'){const a=tr.start;press(a>-135&&a<-45?'menu':a>=-45&&a<=45?'next':a>45&&a<135?'play':'prev')}
  tr=null;
}
wheel.addEventListener('pointerup',endTrack);wheel.addEventListener('pointercancel',endTrack);
center.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();center.classList.add('down')});
center.addEventListener('pointerup',e=>{e.stopPropagation();if(center.classList.contains('down')){center.classList.remove('down');press('select')}});
center.addEventListener('pointerleave',()=>center.classList.remove('down'));

addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='inpt')return;const k=e.key;
  if(k==='h'||k==='H'){setHold(!holdOn);return}
  if(k==='ArrowDown'){scroll(1);e.preventDefault()}else if(k==='ArrowUp'){scroll(-1);e.preventDefault()}
  else if(k==='Enter')press('select');else if(k==='Escape'||k==='Backspace')press('menu');
  else if(k===' '){press('play');e.preventDefault()}else if(k==='ArrowRight')press('next');else if(k==='ArrowLeft')press('prev')});
let wacc=0;addEventListener('wheel',e=>{wacc+=e.deltaY;while(wacc>40){wacc-=40;scroll(1)}while(wacc<-40){wacc+=40;scroll(-1)}},{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- battery (real level where the browser exposes it, e.g. Chrome/Android) ---------- */
if(navigator.getBattery)navigator.getBattery().then(b=>{const upd=()=>{const el=$('#batlvl');el.style.width=Math.max(8,Math.round(b.level*100))+'%';
  el.style.background=b.charging?'linear-gradient(#ffe066,#e7b400)':b.level<=.2?'linear-gradient(#ff8a80,#d32f2f)':'';};
  upd();b.addEventListener('levelchange',upd);b.addEventListener('chargingchange',upd)}).catch(()=>{});


/* ---------- updates: detect a newly published version, offer to reload, show What's New ----------
   Works with GitHub Pages deploying straight from main (no build step): the iPod fingerprints the page
   it is running and periodically compares it with the page currently published. Any push changes the
   fingerprint. The changelog comes from GitHub's public commit history (merged PR titles). */
const REPO_API='https://api.github.com/repos/yartproductions/ipod';
const sha256hex=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let runningHash=null,updateHash=null,laterHash=null,updTimer=null,changelogCache=null;
const pageUrl=()=>location.origin+location.pathname;
async function pageHash(mode){const r=await fetch(pageUrl(),{cache:mode});if(!r.ok)throw new Error('HTTP '+r.status);return sha256hex(await r.text())}
async function changelog(){
  if(changelogCache&&Date.now()-changelogCache.at<10*60e3)return changelogCache.list;
  try{
    const r=await fetch(REPO_API+'/commits?sha=main&per_page=60',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw 0;
    const all=await r.json(),by=new Map(all.map(c=>[c.sha,c]));let c=all[0];const out=[];
    while(c&&out.length<25){                                   // first-parent walk = what actually landed on main
      const msg=(c.commit&&c.commit.message||'').trim(),lines=msg.split('\n').map(x=>x.trim()).filter(Boolean);
      const pr=/^Merge pull request #(\d+)/.exec(lines[0]||'');
      const title=pr?(lines[1]||lines[0]):lines[0];
      if(title&&!/^Merge (branch|remote-tracking)/.test(title))out.push({sha:c.sha,date:(c.commit.committer||c.commit.author||{}).date,title,pr:pr?+pr[1]:null});
      c=c.parents&&c.parents[0]?by.get(c.parents[0].sha):null;
    }
    changelogCache={at:Date.now(),list:out};ls.set('ipod.changelog',out);return out;
  }catch(e){return changelogCache?changelogCache.list:ls.get('ipod.changelog',[])}
}
const fmtDay=d=>{try{return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return ''}};
function changelogHTML(list,limit){
  if(!list.length)return '<p>No change notes available right now.</p>';
  return '<ul class="cl">'+list.slice(0,limit||list.length).map(e=>`<li><span class="d">${esc(fmtDay(e.date))}</span><span class="x">${esc(e.title)}${e.pr?`<small>#${e.pr}</small>`:''}</span></li>`).join('')+'</ul>';
}
// ----- sheet (modal frame) -----
let sheet=null;   // {kind, sel, buttons:[{label, run}], off}
function openSheet(kind,title,html,buttons){
  sheet={kind,sel:0,buttons,off:0,scrolls:kind==='whatsnew'};$('#sheetT').textContent=title;$('#sheetIn').innerHTML=html;$('#sheetIn').style.transform='';
  $('#sheetBtns').innerHTML=buttons.map((b,i)=>`<div class="bt${i===0?' sel':''}" data-b="${i}">${esc(b.label)}</div>`).join('')+
    (settings.style==='Modern'?'':'<div class="hint">Spin to choose · Center to select</div>');
  $('#sheet').classList.add('on');triggerHaptic('success');
}
function closeSheet(){sheet=null;$('#sheet').classList.remove('on')}
function sheetSel(i){if(!sheet)return;sheet.sel=i;document.querySelectorAll('#sheetBtns .bt').forEach((el,k)=>el.classList.toggle('sel',k===i))}
function sheetScroll(dir){
  if(!sheet)return;const inn=$('#sheetIn'),box=$('#sheetB'),max=Math.max(0,inn.scrollHeight-box.clientHeight);
  if(sheet.scrolls&&max>0&&!(dir>0&&sheet.off>=max&&sheet.buttons.length>1)&&!(dir<0&&sheet.off<=0&&sheet.sel>0)){   // scroll text first, then move between buttons
    const no=Math.max(0,Math.min(max,sheet.off+dir*20));if(no!==sheet.off){sheet.off=no;inn.style.transform=`translateY(${-no}px)`;click();return}}
  const ns=Math.max(0,Math.min(sheet.buttons.length-1,sheet.sel+dir));if(ns!==sheet.sel){sheetSel(ns);click()}
}
function sheetPress(btn){
  if(!sheet)return false;click();
  if(btn==='menu'){const b=sheet.buttons.find(x=>x.cancel)||sheet.buttons[sheet.buttons.length-1];closeSheet();b.run&&b.run();return true}
  if(btn==='select'){const b=sheet.buttons[sheet.sel];closeSheet();b.run&&b.run();return true}
  return true;   // swallow ⏮ ⏭ ⏯ while the frame is up
}
$('#sheetBtns').addEventListener('click',e=>{const el=e.target.closest('[data-b]');if(!el||!sheet)return;sheetSel(+el.dataset.b);sheetPress('select')});
// ----- applying an update -----
async function applyUpdate(){
  setHdrTask('Updating…',.5);
  try{await fetch(pageUrl(),{cache:'reload'})}catch(e){}        // refresh the browser's copy of the page first
  try{if(navigator.serviceWorker){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}catch(e){}
  try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
  ls.set('ipod.updatedFrom',{hash:runningHash,at:Date.now()});
  location.reload();
}
async function showUpdatePrompt(){
  if(sheet)return;
  openSheet('update','Update Available','<p>A new version of your iPod has been published.</p><p style="opacity:.7">Loading change notes…</p>',
    [{label:'Update Now',run:applyUpdate},{label:'Later',cancel:true,run:()=>{laterHash=updateHash}}]);
  const list=await changelog(),since=ls.get('ipod.seenAt',0);
  const fresh=list.filter(e=>!since||new Date(e.date).getTime()>since);
  const show=fresh.length?fresh:list,more=show.length-2;
  if(sheet&&sheet.kind==='update')$('#sheetIn').innerHTML=`<p>A new version is ready:</p>${changelogHTML(show,2)}${more>0?`<p style="opacity:.6;margin-top:3px">and ${more} more change${more===1?'':'s'} in What’s New</p>`:''}`;
}
async function checkForUpdate(manual){
  if(!runningHash||!navigator.onLine){if(manual)push(msgView(navigator.onLine?'Checking…':'You’re Offline',navigator.onLine?'Try again in a moment.':'Connect to the internet to check for updates.'));return}
  let h;try{h=await pageHash('no-store')}catch(e){if(manual)push(msgView('Couldn’t Check','The update server didn’t respond. Try again later.'));return}
  if(h!==runningHash){updateHash=h;if(manual||h!==laterHash)showUpdatePrompt()}
  else if(manual)push(msgView('Up to Date','You have the latest version of iPod.'));
}
function showWhatsNew(auto){
  openSheet('whatsnew','What’s New','<p style="opacity:.7">Loading…</p>',[{label:'Done',cancel:true}]);
  changelog().then(list=>{if(!sheet||sheet.kind!=='whatsnew')return;
    const since=auto&&auto.at?auto.at:0,fresh=since?list.filter(e=>new Date(e.date).getTime()>since-6e4):list;
    $('#sheetIn').innerHTML=(auto&&fresh.length?`<p>Your iPod was updated. Here’s what changed:</p>`:'')+changelogHTML(fresh.length?fresh:list,auto?8:25)});
}
async function initUpdates(){
  if(!/^https?:$/.test(location.protocol)||!(window.crypto&&crypto.subtle))return;
  try{runningHash=await pageHash('force-cache')}catch(e){return}   // the copy this page was loaded from
  const prev=ls.get('ipod.runningHash',null),from=ls.get('ipod.updatedFrom',null);
  if(prev&&prev!==runningHash){ls.set('ipod.updatedFrom',null);setTimeout(()=>showWhatsNew(from||{at:ls.get('ipod.seenAt',0)}),900)}
  ls.set('ipod.runningHash',runningHash);if(!prev||prev!==runningHash)ls.set('ipod.seenAt',Date.now());
  const poll=()=>checkForUpdate(false);
  clearInterval(updTimer);updTimer=setInterval(poll,5*60e3);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});
  addEventListener('online',poll);setTimeout(poll,4000);
}
/* ---------- boot ---------- */
stack=[mainMenu()];render();wake();initUpdates();
dbAll().then(rs=>{if(rs.length){songs=rs.map(hydrate);sortSongs();render()}});

})();
