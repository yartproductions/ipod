# XcodeGen spec for the native wrapper. On a Mac:
#   brew install xcodegen
#   cd ios && xcodegen generate && open IPod.xcodeproj
# Then pick your Apple ID team under Signing & Capabilities and run on a connected iPhone.
name: IPod
options:
  bundleIdPrefix: com.yartproductions
  deploymentTarget:
    iOS: "16.0"
targets:
  IPod:
    type: application
    platform: iOS
    sources:
      - path: IPodApp.swift
      - path: IPodWebView.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yartproductions.ipod
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: iPod
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
